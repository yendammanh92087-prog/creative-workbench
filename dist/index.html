<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创作工作台 · 把想法讲清楚</title>
<style>
:root{--bg:#f6f5f1;--ink:#242d29;--muted:#788079;--line:#e2e5dd;--green:#315c48;--light:#eaf0e7;--purple:#816482}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b59bc2;outline-offset:3px}button{border:1px solid var(--line);border-radius:9px;background:white;padding:10px 17px;color:var(--ink)}button:hover{border-color:var(--green);background:#f0f4ed}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#254536;color:white}.layout{display:grid;grid-template-columns:226px 1fr;min-height:100vh}aside{padding:32px 20px;background:#fafaf7;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}.brand{font-size:20px;font-weight:650;letter-spacing:2px}.brand span{display:inline-grid;place-items:center;background:var(--green);color:#fff;width:32px;height:32px;border-radius:10px;margin-right:8px}.small{font-size:12px;color:var(--muted)}nav{display:grid;gap:8px}nav button{text-align:left;background:transparent;border-color:transparent}nav button.active{background:var(--light);color:var(--green);font-weight:600}nav em{font-style:normal;opacity:.5;margin-right:12px}.aside-bottom{margin-top:auto;padding:16px 8px;border-top:1px solid var(--line)}main{max-width:1300px;width:100%;margin:0 auto;padding:28px 48px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;gap:10px}.badge{font-size:12px;border:1px solid #d9d8cb;border-radius:20px;padding:4px 10px;color:#77765d}.hero{padding:48px 0 24px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:600}h1{font-size:36px;line-height:1.4;letter-spacing:-1px;font-weight:600;margin:12px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0;color:#636f65}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0 30px}.card{padding:24px 20px;background:#fff;border:1px solid var(--line);border-radius:14px;text-align:left;min-height:224px;display:flex;flex-direction:column;align-items:start}.card .num{color:var(--green);background:var(--light);border-radius:10px;padding:5px 11px;margin-bottom:24px}.card p{font-size:13px}.card .go{margin-top:auto;padding-top:16px;color:var(--green);font-size:13px}.panel{border:1px solid var(--line);background:white;border-radius:14px;padding:26px;margin:18px 0}.feature{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;background:#eaf0e7}.feature h2{font-size:25px}.notice{background:#f0eee6;padding:12px 16px;border-radius:8px;font-size:13px;color:#76715f}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:22px}.steps{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.steps span{padding:7px 14px;border-radius:24px;font-size:13px;color:var(--muted);border:1px solid var(--line)}.steps .current{background:var(--green);color:white;border-color:var(--green)}label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}textarea,input,select{width:100%;border:1px solid #d8ded4;border-radius:8px;background:#fcfcfa;color:var(--ink);padding:12px}textarea{min-height:165px;resize:vertical}input[type=checkbox]{width:auto;margin-right:8px}input[type=file]{font-size:13px}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.source{font-size:13px;border-top:1px solid var(--line);padding-top:12px;margin-top:20px}summary{cursor:pointer;color:var(--green)}.row{padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.tag{font-size:11px;background:#f1edf4;color:var(--purple);padding:3px 7px;border-radius:4px;margin-left:8px}.script{white-space:pre-wrap;color:var(--ink);line-height:2}.empty{padding:35px 12px;text-align:center;color:var(--muted)}.checklist label{font-weight:400}.status{font-size:12px;color:var(--green);min-height:22px}video{width:100%;max-height:380px;background:#111;border-radius:8px}.hidden{display:none}.footer{margin-top:32px;font-size:12px;color:var(--muted)}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}main{padding:24px}.two{grid-template-columns:1fr}}@media(max-width:680px){.layout{display:block}aside{padding:16px;gap:12px;border-bottom:1px solid var(--line)}nav{grid-template-columns:repeat(3,1fr);gap:2px}nav button{font-size:12px;padding:8px 3px;text-align:center}nav em,.aside-bottom,aside>.small{display:none}main{padding:20px 16px}.hero{padding-top:25px}h1{font-size:28px}.cards{gap:10px}.card{padding:16px;min-height:200px}.feature{grid-template-columns:1fr}.panel{padding:20px}.brand{font-size:18px}.topbar{font-size:12px}}
.cards{grid-template-columns:repeat(5,minmax(0,1fr))}.position-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.position-grid textarea{min-height:110px}.position-grid .panel{padding:20px}.card h3{font-size:16px}.card p{line-height:1.8}.card .num{margin-bottom:18px}#location{white-space:nowrap}@media(max-width:1200px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.position-grid{grid-template-columns:1fr}.position-grid .panel{margin:6px 0}}@media(max-width:680px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card:first-child{grid-column:1/-1;min-height:160px}.topbar{align-items:flex-start}.badge{font-size:10px}.position-grid{display:block}textarea{font-size:16px}footer button{display:block;margin-top:12px}}
</style></head><body><div class="layout"><aside><div class="brand"><span>作</span>创作工作台</div><div class="small">把经历变成作品，把表达交还给你。</div><nav aria-label="工作流程"><button data-page="home">工作台首页</button><button data-page="position"><em>01</em>定位</button><button data-page="topic"><em>02</em>选题</button><button data-page="writing"><em>03</em>文案</button><button data-page="shoot"><em>04</em>准备拍摄</button><button data-page="review"><em>05</em>看成片</button></nav><div class="aside-bottom"><div class="small">知识底座</div><strong>Obsidian</strong><p class="small">唯一维护源 · 尚未连接<br>方法依据不会伪装成已核实</p><button data-page="gaps">查看待补清单 ↗</button></div></aside><main><header class="topbar"><span>创作空间 / <b id="location">工作台首页</b></span><span class="badge">交互原型 V0.2 · 非 AI 成品</span></header><div id="app"></div><div id="status" class="status" role="status"></div><footer class="footer">原型不会读取或修改 Obsidian。输入仅保存在当前浏览器；视频不上传。清除浏览器数据会丢失草稿。<button id="export">导出当前工作记录</button></footer></main></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');let page='home',step=0,videoURL;
const initial={topic:'',audience:'',form:'配音 Vlog',material:'',outline:'',draft:'',accepted:false,example:false,notes:'',reviewNotes:'',shootNotes:'',socialIdentity:'',businessIdentity:'',identityEvidence:'',offering:'',paymentScene:'',businessReason:'',contentAudience:'',contentValue:'',contentTopics:'',contentFormat:''};let state={...initial};try{state={...initial,...JSON.parse(localStorage.getItem('creative-workbench-v1')||'{}')}}catch(e){}
if(!['口播','配音 Vlog'].includes(state.form)){state.previousForm=state.form;state.form='配音 Vlog';}
const names={home:'工作台首页',position:'定位',topic:'选题',writing:'文案',shoot:'准备拍摄',review:'看成片',gaps:'待补清单'};
const example={topic:'夫妻消费观：同一笔钱，各自买到了什么',audience:'有共同生活经验、也有不同消费偏好的人',form:'配音 Vlog',material:'示范素材（取自已提供的生活案例，非定稿）：给猫洗澡花120元，丈夫洗剪吹39元。一个喜欢超市的方便省事，一个喜欢菜市场的生活感。丈夫买近5000元的电动车，形容骑上以后自己的腿重新长回来了。',outline:'开头｜120元给猫洗澡，与39元洗剪吹形成生活反差。\n第一段｜说清给猫洗澡买到的开心，不替任何一方判对错。\n第二段｜超市和菜市场，各自喜欢的具体理由。\n第三段｜电动车带来的自由，用本人原话承接。\n结尾｜停在两人愿意为不同体验花钱，不强行提问。',draft:'【流程示范稿｜不是你的定稿，也不是根据输入自动生成】\n\n中年夫妻的消费观，能有多大的差异？\n我花120块给猫洗了个澡，我老公洗剪吹一套才39块。\n\n我就是喜欢把猫送出去洗。洗完香香的，有人照顾它，还能带它出门转一圈。这120块，我花得开心。\n\n买菜也是。我喜欢楼下超市，走几步就到，东西明码标价，不用惦记是不是买贵了。\n他更喜欢菜市场。逛一圈像出去玩，也会想起小时候跟爸妈买菜。\n\n他嫌我打车贵，后来自己买了辆将近5000块的电动车。\n可他说，骑上以后，自己的腿重新长回来了。想去哪儿就去哪儿。\n\n这笔钱买到的感觉，我倒是能理解。\n只是我们俩想买的，常常不是同一种。',example:true,accepted:false};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem('creative-workbench-v1',JSON.stringify(state));$('#status').textContent='已保存在此浏览器'}catch(e){$('#status').textContent='浏览器存储不可用，请导出工作记录'}}
function hero(k,t,d){return `<div class="hero"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>`}function field(key,label,placeholder='',type='textarea'){return `<label for="${key}">${label}</label><${type} id="${key}" data-field="${key}" placeholder="${placeholder}" ${type==='input'?`value="${esc(state[key])}"`:''}>${type==='textarea'?esc(state[key]):''}</${type}>`}function sources(){return `<details class="source"><summary>查看判断依据与边界</summary><p>当前仅落实本轮确认的流程：真实材料优先、先确认结构再写稿、不强制结尾提问、不同内容形式分开处理。</p><p>页面下方已有方法出处与适用边界；当前并非实时知识库检索。本页示范不代表效果已验证。</p></details>`}
function render(){ $('#location').textContent=names[page];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='home')app.innerHTML=hero('从这里开始','今天，从哪一步开始？','不用懂提示词。带着一个想法、一份稿子，或一条视频来。')+`<div class="cards">${[['position','01','先想清楚自己的定位','人设、商业与内容，一起理清楚','进入定位'],['topic','02','找一个值得讲的选题','把模糊想法变成明确方向','进入选题'],['writing','03','把经历写成文案','先理清素材，再一起确定怎么讲','进入文案'],['shoot','04','知道接下来怎么拍','按内容形式准备镜头与素材','准备拍摄'],['review','05','看看成片哪里能更好','内容与制作分开看，逐项修改','开始看成片']].map(x=>`<button class="card" data-page="${x[0]}"><span class="num">${x[1]}</span><h3>${x[2]}</h3><p>${x[3]}</p><span class="go">${x[4]} →</span></button>`).join('')}</div><div class="panel feature"><div><div class="eyebrow">先体验一次完整流程</div><h2>从生活碎片，到一份可修改的稿子</h2><p>用“中年夫妻的消费观”体验素材 → 结构确认 → 稿件 → 复查。演示内容预先编写，不会假装 AI 已经生成。</p><button class="primary" id="demo">打开文案示范 →</button></div><div><h3>这一版，你可以验证什么？</h3><p>入口是否直观，步骤是否顺手，输出是不是你要的。</p><div class="notice">真实 AI 分析、知识检索与自动审片还未接入。</div></div></div><button data-page="gaps">查看交给小拆的待补清单 ↗</button>`;
if(page==='position')app.innerHTML=hero('01 / POSITION','定位，不只是给自己贴标签','把人设、商业与内容放在一起。已有底稿可以直接填入，不必每次重做。')+`<div class="notice">这是人工梳理表，不会自动判断定位是否正确。下列目录经融新确认；课程依据保留来源与边界。</div><div class="position-grid"><section class="panel"><span class="eyebrow">A / 我是谁</span><h2>人设定位</h2>${field('socialIdentity','社会身份','社会关系、性格与行为特征：用真实生活细节来说明。')}${field('businessIdentity','商业身份','以什么身份提供专业价值？例如医生、老板、顾问。')}${field('identityEvidence','真实的人设细节','哪些真实经历和反复出现的行为，能让观众认识你？')}<details class="source"><summary>依据：木子双身份 / Don 课程嘉宾</summary><p>木子 D1 3:48:28–3:48:48：从商业身份与社会身份挖掘人设。商业身份不是完整商业定位。</p><p>人设表达参考 Don 广州课程 day1_9 23:03–23:55：通过反复呈现具体细节建立记忆点（超级符号）。讲者是嘉宾老李，不是 Don；真实材料优先是工作台边界，不将其冒称为该段原话。</p><p>后台检索路径：木子方法卡·卡8；Don 提炼笔记 day1_part3。原文转写已回读，效果未在本产品验证。</p></details></section><section class="panel"><span class="eyebrow">B / 我提供什么</span><h2>商业定位</h2>${field('offering','卖什么、卖给谁','具体产品或服务，真正的购买者；还未确定可写待探索。')}${field('paymentScene','需求与付费场景','对方提出过什么问题？什么情况下购买？谁拍板？')}${field('businessReason','为什么做这个方向','市场需求、产业环节、自身背景：哪些有证据，哪些是假设？')}<details class="source"><summary>依据：周百见商业咨询</summary><p>核验报告 §2.1–2.4：商业定位回答卖什么、卖给谁。商业目标明确时，可先商业、再内容、最后完善人设。</p><p>这是咨询场景下的判断原则，不是普适量化公式。本轮依库内报告，原始逐字稿受权限限制；已填写的咨询表样例已入库，空白模板原件未取得。</p></details></section><section class="panel"><span class="eyebrow">C / 我长期讲什么</span><h2>内容定位</h2>${field('contentAudience','给谁看','观众是谁，与购买者是同一群人吗？')}${field('contentValue','提供什么观看价值','用处、兴趣或共鸣：用自己的内容举例。')}${field('contentTopics','长期讲什么','可以持续讲的故事、过程、知识与观点。')}${field('contentFormat','用什么形式呈现','口播或配音 Vlog；按你的真实拍摄条件选择。')}<details class="source"><summary>依据：薛辉 / Don 课程嘉宾</summary><p>薛辉 M2–M5、M17：目标群体、商业定位、内容方向与三有原则。来自库内已核教材卡，本轮未重看原图。</p><p>Don 课程 day2_5 43:00–43:25：用户、形式、风格与价值定位；讲者为嘉宾老李，已回读机器转写。</p><p>本表为跨来源产品整理，不声称是任何老师完整原版框架。</p></details></section></div><div class="panel"><h3>把定位带到下一步</h3><p>人设让观众认识你，商业定位说明你为谁提供什么，内容定位安排如何持续表达。可以边实践边调整。</p><div class="actions"><button id="positionExport">导出定位底稿</button><button id="usePosition" class="primary">带着定位去选题 →</button></div></div>`;
if(page==='topic')app.innerHTML=hero('02 / TOPIC','先找到，你真正想讲的事','不必先有漂亮标题。一件经历、一个观察，也可以成为起点。')+`<div class="two"><section class="panel">${field('topic','你想聊什么？','写下一个真实经历或方向')}${field('audience','你希望谁看到？','不确定也可以先写不知道','input')}${field('material','有哪些具体事实？','发生了什么、你做了什么、有什么结果')}<div class="notice">这里不会自动判断选题好坏。先留下材料，再交给已核方法或人工判断。</div><div class="actions"><button class="primary" data-page="writing">带着材料去写文案 →</button></div></section><section class="panel"><h2>一起想清楚四件事</h2>${['给谁看：谁会在意这件事？','值得看：他为什么愿意听？','真材料：哪些是亲历，哪些待核？','怎么讲：哪种形式适合你？'].map(x=>`<div class="row">${x}</div>`).join('')}${sources()}</section></div>`;
if(page==='writing'){app.innerHTML=hero('03 / WRITING','把你想说的，讲清楚','你决定说什么。工具帮助整理，不替你编造经历。')+`<div class="steps">${['提供素材','确认结构','形成稿件','检查与复查'].map((x,i)=>`<span class="${i===step?'current':''}">${i+1} ${x}</span>`).join('')}</div><div class="two"><section class="panel">${step===0?`${field('topic','本次主题','','input')}<label for="form">内容形式</label><select id="form" data-field="form">${['配音 Vlog','口播'].map(x=>`<option ${state.form===x?'selected':''}>${x}</option>`).join('')}</select>${field('material','你的经历 / 原话 / 已有材料','也可以直接粘贴现有稿件')}<p class="small">已有稿件？可跳到稿件编辑，不必重新走创作流程。</p><div class="notice">没有接入 AI：下一步是手动结构编辑。想体验完整示例，可点右侧“载入预写示范”。</div><div class="actions"><button class="primary" id="next">整理结构 →</button><button id="existing">我已有稿件</button></div>`:step===1?`<h2>先定怎么讲，再写完整稿</h2><div class="notice">${state.example?'以下为预写示范结构，可修改后确认。':'AI 尚未接入。请填写或粘贴结构方案，本页不会自动编写。'}</div>${field('outline','结构方案','开头讲什么？中间有哪些事情？最后停在哪里？')}<label><input type="checkbox" id="accept" ${state.accepted?'checked':''}>我确认这版结构，可以进入写稿</label><div class="actions"><button id="back">上一步</button><button id="next" class="primary" ${!state.accepted||!state.outline.trim()?'disabled':''}>进入稿件 →</button></div>`:step===2?`<h2>${state.example?'预写示范稿':'你的稿件'}</h2><div class="notice">${state.example?'这是一份流程样例，不是最终稿。':'可手动写稿或粘贴稿件；当前没有 AI 生成功能。'}</div>${field('draft','逐字稿','在这里写入你的稿件')}<div class="actions"><button id="back">上一步</button><button class="primary" id="next">检查这份稿件 →</button></div>`:`<h2>逐项看，不急着全改</h2><p>以下为人工复查清单，不是系统已经完成的判断。</p><div class="checklist">${['事实与原话核对过，没有编造','结构适合当前内容形式','表达重复处已检查，没有误删情绪','结尾自然，不硬拉互动','用户明确要保留的内容没有被覆盖'].map((x,i)=>`<label><input type="checkbox" data-check="${i}" ${state['check'+i]?'checked':''}>${x}</label>`).join('')}</div>${field('notes','决定修改的地方 / 复查记录','记录旧问题、接受的修改项和新版结果')}<div class="actions"><button id="back">返回改稿</button><button class="primary" id="downloadDraft">导出文案与记录</button><button data-page="shoot">去准备拍摄 →</button></div>`}</section><section class="panel"><h3>这一步交付什么</h3><p>${['可追溯的素材，以及仍缺的信息。','经你确认的结构，不是未经允许的完整改写。','可编辑的完整稿；已有稿件也可直接进入。','你接受的修改项与复查记录。'][step]}</p><div class="row"><strong>创作者保留决定权</strong><p class="small">不替你定稿，不统一套故事顺序，不要求结尾必须提问。</p></div><div class="row"><strong>不同形式，分别判断</strong><p class="small">Vlog 的叙事、观点和情绪安排，不直接套进口播。</p></div>${sources()}<button id="demo">载入预写示范</button></section></div>`;}
if(page==='shoot')app.innerHTML=hero('04 / SHOOT','让稿子，变成能拍的清单','只做口播与配音 Vlog：按你的拍摄条件准备。')+`<div class="two"><section class="panel"><label for="form">拍摄形式</label><select id="form" data-field="form">${['配音 Vlog','口播'].map(x=>`<option ${state.form===x?'selected':''}>${x}</option>`).join('')}</select><div class="notice">以下是准备模板，不是系统已经分析你的稿件。</div><div class="row"><h3>${state.form==='配音 Vlog'?'分镜准备':'口播拍摄准备'}</h3><p>${state.form==='配音 Vlog'?'按段落记录：这段说什么 → 用什么画面 → 已有素材 → 需要补拍。':state.form==='口播'?'确认机位、构图、收音、口播段落，以及确有必要的补充素材。不要求每句话插画面。':'请先选择口播或配音 Vlog。'}</p></div>${field('shootNotes','我的拍摄清单','可填写素材名称、镜头需求和缺拍项')}<button data-page="review" class="primary">已有成片，去检查 →</button></section><section class="panel"><h3>当前稿件</h3><div class="script">${esc(state.draft||'还没有稿件。可以先回文案入口整理，也可以直接填写已有项目的拍摄需求。')}</div></section></div>`;
if(page==='review')app.innerHTML=hero('05 / REVIEW','看成片，也看它有没有讲到点上','先看内容，再看制作。发布数据不是审片的必填项。')+`<section class="panel"><label for="video">选择本地视频，边看边记录</label><input id="video" type="file" accept="video/*"><p class="small">仅本地播放，不上传、不自动识别，文件不会随刷新保留。</p><video id="player" controls class="hidden"></video></section><div class="two"><section class="panel"><h2>内容是否成立</h2><p>开头承诺是否兑现？主线是否清楚？每段是否有作用？画面是否帮助理解？结尾是否合适？</p>${field('reviewNotes','问题与修改记录','记录时间位置、具体问题、建议，以及你接受的修改')}<div class="actions"><button id="timestamp">插入当前播放时间</button><button id="downloadDraft" class="primary">导出审片记录</button></div></section><section class="panel"><h2>制作是否妥当</h2><p>字幕准确同步、文字不遮脸、人声清楚、剪切和气口自然。</p><div class="notice">自动审片尚未接入。没有观看或检测，便不会显示“检查通过”。</div>${sources()}</section></div>`;
if(page==='gaps')app.innerHTML=hero('查缺 / 小拆补件入口','缺什么，明确列出来','不重新设计主目录，不把候选方法写成已验证结论。')+`<section class="panel">${[['01','五入口的方法映射','补具体文件与章节、判据、适用形式；来源核验 / 采用状态 / 应用验证分列。'],['02','段落作用的判断依据','补事实推进、情绪、人物与氛围的正反例；不能把停顿一概当废话。'],['03','拍摄模板','配音 Vlog 分镜与口播清单的真实范例。'],['04','追问与形态边界','补缺什么必须问、哪些可以继续；周百见原表未核前不得冒用原表名称。'],['05','真实测试作品','提供经人确认的稿件、成片、问题和修改记录，用来检验建议是否有效。'],['06','技术接入（不是小拆的任务）','AI、Obsidian 检索、媒体分析、跨设备存储与安装方案尚未实现。']].map(x=>`<div class="row"><h3>${x[0]} ${x[1]}<span class="tag">待补 / 待实现</span></h3><p>${x[2]}</p></div>`).join('')}<button id="gapExport">导出待补清单</button></section>`;
bind();if(page==='review'&&videoURL){$('#player').src=videoURL;$('#player').classList.remove('hidden')}}
function download(name,text){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function record(){return '# 创作工作记录\n\n原型手动记录，非 AI 自动分析。\n\n'+Object.entries(state).map(([k,v])=>`## ${{topic:'主题',audience:'受众',form:'形式',material:'素材',outline:'结构',draft:'稿件',notes:'修改与审片记录',shootNotes:'拍摄清单',reviewNotes:'成片问题与复查',socialIdentity:'社会身份',businessIdentity:'商业身份',identityEvidence:'真实人设细节',offering:'卖什么、卖给谁',paymentScene:'需求与付费场景',businessReason:'方向选择依据',contentAudience:'内容受众',contentValue:'观看价值',contentTopics:'长期内容方向',contentFormat:'呈现形式',accepted:'结构确认',example:'使用示范'}[k]||k}\n${v}`).join('\n\n')}
function bind(){if($('#positionExport'))$('#positionExport').onclick=()=>download('账号定位底稿.md',record());if($('#usePosition'))$('#usePosition').onclick=()=>{if(!state.audience)state.audience=state.contentAudience;save();page='topic';render();window.scrollTo(0,0)};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{state[el.dataset.field]=el.value;if(el.dataset.field==='outline'){state.accepted=false;if($('#accept'))$('#accept').checked=false;if($('#next'))$('#next').disabled=true}save();if(el.dataset.field==='form'&&page==='shoot')render()});document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state['check'+el.dataset.check]=el.checked;save()});if($('#demo'))$('#demo').onclick=()=>{if((state.material||state.draft)&&!confirm('载入示范会替换当前主题、文案素材、结构、稿件与文案复查项；定位和审片记录保留。建议先导出。继续吗？'))return;state={...state,...example,notes:''};for(let i=0;i<5;i++)state['check'+i]=false;step=0;page='writing';save();render()};if($('#next'))$('#next').onclick=()=>{step++;render();window.scrollTo(0,0)};if($('#back'))$('#back').onclick=()=>{step--;render()};if($('#existing'))$('#existing').onclick=()=>{step=2;render()};if($('#accept'))$('#accept').onchange=e=>{state.accepted=e.target.checked;save();$('#next').disabled=!state.accepted||!state.outline.trim()};if($('#downloadDraft'))$('#downloadDraft').onclick=()=>download('创作工作记录.md',record());if($('#gapExport'))$('#gapExport').onclick=()=>download('小拆_工作台待补清单.md',app.innerText);if($('#video'))$('#video').onchange=e=>{const f=e.target.files[0];if(!f)return;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(f);$('#player').src=videoURL;$('#player').classList.remove('hidden')};if($('#timestamp'))$('#timestamp').onclick=()=>{const t=$('#player').currentTime||0;state.reviewNotes+='\n['+Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'] ';$('#reviewNotes').value=state.reviewNotes;save()};}$('#export').onclick=()=>download('创作工作记录.md',record());render();
